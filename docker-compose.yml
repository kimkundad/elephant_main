services:
  nginx:
    image: nginx:alpine
    container_name: elephant-nginx
    ports:
      # Loopback only: the host nginx proxies here. Docker's published ports
      # skip ufw, so 0.0.0.0 would let anyone bypass the host nginx.
      - "127.0.0.1:8083:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: elephant-php
    volumes:
      - ./:/var/www
    environment:
      TZ: Asia/Bangkok
      # 1 locally so edits show up; set PHP_OPCACHE_VALIDATE_TIMESTAMPS=0 in
      # the server's .env and restart php after each deploy.
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
    restart: unless-stopped
